services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Not exposed to the host or the internet — only reachable by other
    # containers on this compose network.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      RSVP_TO: ${RSVP_TO}
      UPLOAD_DIR: /uploads
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-credentials.json
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      GOOGLE_SHEET_TAB: ${GOOGLE_SHEET_TAB:-Sheet1}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/uploads
      - ./google-credentials.json:/run/secrets/google-credentials.json:ro

volumes:
  pgdata:
  uploads:
